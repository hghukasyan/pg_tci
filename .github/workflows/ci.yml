name: pg_tci CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  installcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 18
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-server-dev-18

      - name: Build and install
        run: |
          export PATH=/usr/lib/postgresql/18/bin:$PATH
          export PG_CONFIG=/usr/lib/postgresql/18/bin/pg_config
          make clean && make
          sudo env PATH="$PATH" PG_CONFIG="$PG_CONFIG" make install

      - name: installcheck (+ isolation)
        run: |
          set -euo pipefail
          export PATH=/usr/lib/postgresql/18/bin:$PATH
          export PG_CONFIG=/usr/lib/postgresql/18/bin/pg_config
          export PGHOST=/var/run/postgresql
          export PGPORT=5432
          export PGUSER=postgres

          sudo pg_ctlcluster 18 main start
          for i in $(seq 1 30); do
            pg_isready -h "$PGHOST" -p "$PGPORT" && break
            sleep 1
          done
          pg_isready -h "$PGHOST" -p "$PGPORT"

          sudo -u postgres createuser -s "$USER" || true
          sudo -u postgres psql -c "SELECT version();"

          unset PGUSER
          export PGUSER="$USER"
          make installcheck

  release-tarball:
    runs-on: ubuntu-latest
    needs: [installcheck]
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 18
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-server-dev-18

      - name: Build release tarball
        run: |
          export PATH=/usr/lib/postgresql/18/bin:$PATH
          export PG_CONFIG=/usr/lib/postgresql/18/bin/pg_config
          ./scripts/make_release_tarball.sh
          ls -la out/
          test -n "$(compgen -G 'out/*.tar.gz')"
          test -n "$(compgen -G 'out/*.sha256')"
          tar -tzf out/*.tar.gz | grep -E 'lib/pg_tci\.so$'

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: pg_tci-linux-x86_64
          path: |
            out/*.tar.gz
            out/*.sha256
          if-no-files-found: error
